<ion-content>
  <main class="sleep-page">
    <h1 class="logo">sleepi</h1>

    <div class="middle">
      <p class="label">{{ sleepStart === null ? 'You are awake' : 'You are asleep' }}</p>
      <p class="big-time">{{ timer }}</p>
      <p class="since">{{ sinceText }}</p>
    </div>

    <div class="bottom">
      <ion-button expand="block" (click)="toggleSleep()">
        {{ sleepStart === null ? 'Go to sleep' : 'Wake up' }}
      </ion-button>
      <ion-button expand="block" fill="clear" [class.hidden]="sleepStart === null" (click)="cancelSleep()">
        Cancel, I didn't mean to
      </ion-button>
    </div>
  </main>
</ion-content>
