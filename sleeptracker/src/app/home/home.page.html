<ion-content>
  <main class="sleep-page">
    <h1>sleepi</h1>

    <p class="label">{{ sleepStart === null ? 'You are awake' : 'You are sleeping' }}</p>
    <p class="big-time">{{ timer }}</p>
    <p class="since">{{ sinceText }}</p>

    <ion-button expand="block" (click)="toggleSleep()">
      {{ sleepStart === null ? 'Go to sleep' : 'Wake up' }}
    </ion-button>

    @if (sleepStart !== null) {
      <ion-button expand="block" fill="clear" (click)="cancelSleep()">Cancel this sleep session</ion-button>
    }
  </main>
</ion-content>
